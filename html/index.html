<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="elevator" class="elevator" aria-hidden="true">
        <section class="panel" aria-label="Elevator panel">
            <div class="panel-header">
                <span id="title">Elevator</span>
                <button id="close" class="close-button" type="button" aria-label="Close">X</button>
            </div>

            <div id="current-floor" class="current-floor">CURRENT FLOOR: -</div>

            <div id="display" class="display">SELECT</div>

            <div class="keypad">
                <button type="button" data-key="1">1</button>
                <button type="button" data-key="2">2</button>
                <button type="button" data-key="3">3</button>
                <button type="button" data-key="4">4</button>
                <button type="button" data-key="5">5</button>
                <button type="button" data-key="6">6</button>
                <button type="button" data-key="6">6</button>
                <button type="button" data-key="7">7</button>
                <button type="button" data-key="8">8</button>
                <button type="button" data-key="9">9</button>
                <button type="button" data-enter="true" class="enter">ENT</button>
                <button type="button" data-key="10">10</button>
                <button type="button" data-key="0" class="zero">0</button>
            </div>

            <div id="hint" class="hint">Type floor and press ENT</div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
